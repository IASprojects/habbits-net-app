name: Deploy Stage Pipeline

on:
  push:
    branches: [stage]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore HabitsApp.slnx
      - name: Build
        run: dotnet build HabitsApp.slnx -c Release --no-restore
      - name: Test
        run: dotnet test HabitsApp.slnx -c Release --no-build

  deploy-api:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  deploy-frontend:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Inject Production API URL
        run: |
          mkdir -p src/HabitsApp.Presentation/HabitsApp.WebBlazor/wwwroot
          echo '{"ApiBaseUrl":"https://habbits-net-app.onrender.com"}' > src/HabitsApp.Presentation/HabitsApp.WebBlazor/wwwroot/appsettings.Production.json
      - name: Publish Blazor WASM
        run: dotnet publish src/HabitsApp.Presentation/HabitsApp.WebBlazor/HabitsApp.WebBlazor.csproj -c Release -o publish
      - name: Prepare GitHub Pages Assets
        run: |
          sed -i 's|<base href="/" />|<base href="/habbits-net-app/" />|g' publish/wwwroot/index.html
          touch publish/wwwroot/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot
      - id: deployment
        uses: actions/deploy-pages@v4
